name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: Set up Go
        # actions/setup-go@v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test packages
        run: go test ./...

      - name: Run GoReleaser
        # goreleaser/goreleaser-action@v7.2.2
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer-smoke:
    name: Windows installer smoke
    needs: goreleaser
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout@v6.0.3
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Smoke PowerShell installer
        shell: powershell
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "galley-ps-bin"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Version "${{ github.event.release.tag_name }}" -BinDir $binDir
          & (Join-Path $binDir "galley.exe") --help | Out-Null
