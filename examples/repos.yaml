version: 1
defaults:
  quality_profile_file: "examples/quality-default.yaml"
  environment_profile_file: "examples/environment-local.yaml"
  max_concurrent_tasks: 1
  poll_interval: 10s
  claim_ttl: 30m
  heartbeat_interval: 1m
  commit_on_accept: false
  open_pr: false
  poll_pr_comments: true
  reply_pr_comments: false
  pr_base: "main"
  supervisor: claude
