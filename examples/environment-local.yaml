id: "local-dev"
cwd: "/Users/shinpr/Projects/galley"
commands:
  test_unit: "go test ./..."
  build: "go build ./cmd/galley"
executor:
  default_cli: "codex"
required_checks:
  # Use shell_path to pin a custom shell executable. Recognized executable
  # names such as bash, cmd.exe, powershell.exe, and pwsh.exe can stand alone;
  # use shell as fallback metadata only for renamed wrappers.
  # shell_path: "/path/to/bash"
  shell: "auto"
constraints:
  network: "approval_required"
  secrets_policy: "never_read_env_files"
  destructive_commands: "deny"
pr:
  enabled: true
  base: "main"
  comments:
    enabled: true
    reply: true
worktree:
  cleanup: true
