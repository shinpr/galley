version: 2

project_name: galley

builds:
  - id: galley
    main: ./cmd/galley
    binary: galley
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: galley
    ids:
      - galley
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

release:
  mode: keep-existing
  replace_existing_artifacts: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
