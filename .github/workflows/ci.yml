name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # actions/checkout@v5.0.0
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Go
        # actions/setup-go@v6.4.0
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Check formatting
        run: |
          test -z "$(find . -name '*.go' -not -path './.git/*' -print | xargs gofmt -l)"

      - name: Test packages
        run: go test ./...

      - name: Build binaries
        run: go build -o /tmp/galley ./cmd/galley

      - name: Validate examples
        run: |
          tmp_task="$(mktemp)"
          sed "s#/Users/shinpr/Projects/galley#$(pwd)#" examples/afk-task.yaml > "$tmp_task"
          go run ./cmd/galley task validate "$tmp_task"
          go run ./cmd/galley profile validate --kind quality examples/quality-default.yaml
          go run ./cmd/galley profile validate --kind environment examples/environment-local.yaml
          go run ./cmd/galley schema check

      - name: Validate JSON files
        run: |
          python3 -m json.tool schemas/claude-result.schema.json >/dev/null
          python3 -m json.tool schemas/supervisor-verdict.schema.json >/dev/null
          python3 -m json.tool plugins/galley/skills/galley/references/task.schema.json >/dev/null
          python3 -m json.tool plugins/galley/skills/galley/references/quality.schema.json >/dev/null
          python3 -m json.tool plugins/galley/skills/galley/references/environment.schema.json >/dev/null
          python3 -m json.tool plugins/galley/.claude-plugin/plugin.json >/dev/null
          python3 -m json.tool plugins/galley/.codex-plugin/plugin.json >/dev/null
          python3 -m json.tool .claude-plugin/marketplace.json >/dev/null
          python3 -m json.tool .agents/plugins/marketplace.json >/dev/null

      - name: Smoke test
        run: ./scripts/smoke-local.sh
