id: "local-dev"
cwd: "/Users/shinpr/Projects/galley"
commands:
  test_unit: "go test ./..."
  build: "go build ./cmd/galley"
executor:
  default_cli: "claude"
# Optional repository review overrides; omitted values preserve existing defaults.
# supervisor:
#   default_cli: "claude"
#   model: "claude-sonnet-4-5"
#   effort: "high"  # claude/glm: low|medium|high|xhigh|max; codex adds minimal
required_checks:
  # Use shell_path to pin a custom shell executable. Recognized executable
  # names such as bash, cmd.exe, powershell.exe, and pwsh.exe can stand alone;
  # use shell as fallback metadata only for renamed wrappers.
  # shell_path: "/path/to/bash"
  shell: "auto"
constraints:
  network: "approval_required"
  secrets_policy: "never_read_env_files"
  destructive_commands: "deny"
pr:
  enabled: true
  base: "main"
  comments:
    enabled: true
    reply: true
worktree:
  cleanup: true
# setup defines how Galley prepares a fresh task worktree before the
# implementation executor begins. When this block is absent, Galley dispatches
# a setup executor that discovers a working plan and writes it back here so
# subsequent tasks reuse the learned setup without rediscovery.
setup:
  commands:
    - run: "go mod download"
      why: "fetch Go module cache so build/test commands run hermetically"
    - run: "go build ./..."
      why: "fail fast if the workspace cannot compile before the executor runs"
