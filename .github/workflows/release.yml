name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Go
        # actions/setup-go@v7.0.0
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Test packages
        run: go test ./...

      - name: Run GoReleaser
        # goreleaser/goreleaser-action@v7.3.0
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: v2.12.7
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-installer-smoke:
    name: Windows installer smoke
    needs: goreleaser
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        # actions/checkout@v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Smoke PowerShell installer
        shell: powershell
        run: |
          $binDir = Join-Path $env:RUNNER_TEMP "galley-ps-bin"
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Version "${{ github.event.release.tag_name }}" -BinDir $binDir
          & (Join-Path $binDir "galley.exe") --help | Out-Null
